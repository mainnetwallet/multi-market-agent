[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-market-agent"
version = "0.1.0"
description = "Human-supervised prediction-market trading agent for Polymarket, Kalshi and Limitless"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "LicenseRef-Proprietary"
dependencies = [
  "alembic==1.20.1",
  "cryptography==50.0.2",
  "eth-account==0.13.7",
  "eth-utils==5.3.1",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "polymarket-client==0.15.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "python-dotenv==1.2.4",
  "python-telegram-bot==22.8",
  "SQLAlchemy==2.1.6",
  "structlog==26.1.0",
  "tzdata==2025.3",
  "uvicorn[standard]==0.54.0",
  "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
  "build==1.6.1",
  "mypy==2.4.1",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
]
postgres = ["asyncpg==0.30.0", "psycopg[binary]==3.2.10"]

[project.scripts]
mm-agent = "mm_agent.main:run"
mm-doctor = "mm_agent.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mm_agent = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["alembic/versions"]
