name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=84" wheel
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
      - name: Alembic upgrade on a fresh database
        env:
          DATABASE_URL: sqlite:///./data/ci.db
        run: |
          mkdir -p data
          alembic upgrade head
          alembic check
      - name: Dependency audit
        run: pip-audit

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t mm-agent:ci .
      - name: Run PAPER smoke container
        run: |
          docker run -d --name mm-agent-ci \
            -p 127.0.0.1:8080:8080 \
            -e APP_ENV=production \
            -e ENABLED_VENUES=fake \
            -e ACTIVE_VENUE=fake \
            -e ADMIN_USERNAME=operator \
            -e ADMIN_PASSWORD=ci-password-not-secret \
            -e SESSION_SECRET=ci-session-secret-not-secret \
            -e LLM_BASE_URL= \
            -e LLM_MODEL= \
            mm-agent:ci
          sleep 3
          docker ps -a
          docker logs mm-agent-ci || true
          for i in $(seq 1 30); do
            if curl -fsS -I http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          docker logs --tail 120 mm-agent-ci || true
          curl -fsS -I http://127.0.0.1:8080/health
          docker exec mm-agent-ci id
      - name: Stop container
        if: always()
        run: docker rm -f mm-agent-ci || true
