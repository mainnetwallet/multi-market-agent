name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless; main runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # lint, test, audit and docker-smoke run at the same time on separate runners.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=84" wheel
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts
      - name: Mypy
        run: mypy src

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=84" wheel
          pip install -e ".[dev]"
      - name: Pytest
        run: |
          set +e
          pytest -q --tb=short -rfE 2>&1 | tee /tmp/pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python - <<'PYEOF'
          t = open('/tmp/pytest.log', encoding='utf-8', errors='replace').read()
          lines = [l for l in t.splitlines() if l.startswith(('FAILED', 'ERROR', 'E  ')) or 'Error' in l]
          msg = '\n'.join(lines[:30]) or t[-2000:]
          print('::error title=pytest-failure::' + msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PYEOF
          fi
          exit $code
      - name: Alembic upgrade on a fresh database
        env:
          DATABASE_URL: sqlite:///./data/ci.db
        run: |
          mkdir -p data
          alembic upgrade head
          alembic check

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=84" wheel
          pip install -e ".[dev]"
      - name: Dependency audit
        run: pip-audit

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t mm-agent:ci .
      - name: Run smoke container
        run: |
          docker run -d --name mm-agent-ci \
            -p 127.0.0.1:8080:8080 \
            -e APP_ENV=production \
            -e ENABLED_VENUES=polymarket,kalshi,limitless \
            -e ADMIN_USERNAME=operator \
            -e ADMIN_PASSWORD=ci-password-not-secret \
            -e SESSION_SECRET=ci-session-secret-not-secret \
            -e LLM_BASE_URL= \
            -e LLM_MODEL= \
            mm-agent:ci
          sleep 3
          docker ps -a
          docker logs mm-agent-ci || true
          for i in $(seq 1 30); do
            if curl -fsS -I http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          docker logs --tail 120 mm-agent-ci || true
          curl -fsS -I http://127.0.0.1:8080/health
          docker exec mm-agent-ci id
      - name: Stop container
        if: always()
        run: docker rm -f mm-agent-ci || true
