name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_BASE_URL: ${{ vars.ANDROID_BASE_URL || 'https://multi-market-agent.onrender.com' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Unit tests and debug APK
        run: |
          gradle -p android --no-daemon -PmmBaseUrl="$ANDROID_BASE_URL" testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: mm-agent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
