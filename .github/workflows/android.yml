name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless; main runs are never cancelled.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANDROID_BASE_URL: ${{ vars.ANDROID_BASE_URL || 'https://multi-market-agent.onrender.com' }}
  VERSION_NAME: 2.0.${{ github.run_number }}

jobs:
  # Job 1: unit tests + debug APK. Runs at the same time as the release build and the deploy wait.
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Unit tests and debug APK
        run: gradle -p android --parallel -PmmBaseUrl="$ANDROID_BASE_URL" testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: mm-agent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # Job 2: signed release APK, only for main. Runs in parallel with `debug`.
  release-apk:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MM_KEYSTORE_PASSWORD" ] || [ -z "$MM_KEY_ALIAS" ] || [ -z "$MM_KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Android only installs an update when versionCode is higher than the installed one,
          # so it rises with every workflow run.
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MM_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle -p android --parallel \
            -PmmBaseUrl="$ANDROID_BASE_URL" \
            -PmmVersionCode="$VERSION_CODE" \
            -PmmVersionName="$VERSION_NAME" \
            assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/mm-agent-$VERSION_NAME.apk"
          # The certificate fingerprint must be identical on every release, or phones refuse the update.
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "dist/mm-agent-$VERSION_NAME.apk" | grep -E "Signer #1 certificate SHA-256|Verifies"

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: mm-agent-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # Job 3: waits for Render to serve this commit. Needs no APK, so it polls while the builds run.
  wait-deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      ready: ${{ steps.deploy.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The app and the server ship together: the new APK reads endpoints the new server adds, so the
      # release waits until Render is serving this exact commit. If a newer commit is already live,
      # this one was superseded and its own run (or the newer run) publishes instead.
      - name: Wait for the server deploy of this commit
        id: deploy
        env:
          BASE_URL: ${{ vars.ANDROID_BASE_URL || 'https://multi-market-agent.onrender.com' }}
        run: |
          for i in $(seq 1 60); do
            LIVE="$(curl -fsS --max-time 20 "$BASE_URL/health" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "Server is serving $GITHUB_SHA"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$LIVE" ]; then
              STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$LIVE" --jq .status 2>/dev/null || true)"
              if [ "$STATUS" = "ahead" ]; then
                echo "::notice::Server already runs a newer commit ($LIVE); not publishing the APK of $GITHUB_SHA."
                echo "ready=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "Attempt $i: server reports '${LIVE:-nothing}', waiting for $GITHUB_SHA"
            sleep 20
          done
          echo "::error::Server did not report commit $GITHUB_SHA within 20 minutes; APK not published."
          exit 1

  # Job 4: publish once the three jobs above are done.
  release:
    needs: [debug, release-apk, wait-deploy]
    if: needs.wait-deploy.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mm-agent-release-apk
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: mm-agent-debug-apk
          path: dist-debug

      - name: Publish to GitHub Releases
        run: |
          APK="$(ls dist/*.apk | head -1)"
          VERSION="$(basename "$APK" .apk | sed 's/^mm-agent-//')"
          # The debug build has its own application id (.debug), so it installs next to the release app.
          DEBUG_APK="dist-debug/mm-agent-$VERSION-debug.apk"
          cp dist-debug/app-debug.apk "$DEBUG_APK"
          NOTES="Signed release APK, version $VERSION (build #${{ github.run_number }}), commit ${GITHUB_SHA::7}. The -debug.apk is the debug build of the same commit; it installs next to the release app and does not replace it.

          Install: download the .apk on your phone and open it. Installing over an older release updates it and keeps your login. Releases before this one were signed with a different key, so uninstall those once first."
          # One release per version, kept for good: the tag carries the version, so a new build never
          # replaces an older one. Only a re-run of the same build (same version) refreshes its own files.
          TAG="android-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$DEBUG_APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" "$DEBUG_APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Android app $VERSION" \
              --notes "$NOTES" \
              --latest
          fi
