name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_BASE_URL: ${{ vars.ANDROID_BASE_URL || 'https://multi-market-agent.onrender.com' }}
      VERSION_NAME: 2.0.${{ github.run_number }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Unit tests and debug APK
        run: |
          gradle -p android --no-daemon -PmmBaseUrl="$ANDROID_BASE_URL" testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: mm-agent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build signed release APK
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MM_KEYSTORE_PASSWORD" ] || [ -z "$MM_KEY_ALIAS" ] || [ -z "$MM_KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Android only installs an update when versionCode is higher than the installed one,
          # so it rises with every workflow run.
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MM_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle -p android --no-daemon \
            -PmmBaseUrl="$ANDROID_BASE_URL" \
            -PmmVersionCode="$VERSION_CODE" \
            -PmmVersionName="$VERSION_NAME" \
            assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/mm-agent-$VERSION_NAME.apk"
          # The certificate fingerprint must be identical on every release, or phones refuse the update.
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "dist/mm-agent-$VERSION_NAME.apk" | grep -E "Signer #1 certificate SHA-256|Verifies"

      - name: Upload release APK
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mm-agent-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: apk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: android-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mm-agent-release-apk
          path: dist

      - name: Publish to GitHub Releases
        run: |
          APK="$(ls dist/*.apk | head -1)"
          VERSION="$(basename "$APK" .apk | sed 's/^mm-agent-//')"
          NOTES="Signed release APK, version $VERSION (build #${{ github.run_number }}), commit ${GITHUB_SHA::7}.

          Install: download the .apk on your phone and open it. Installing over an older release updates it and keeps your login. Releases before this one were signed with a different key, so uninstall those once first."
          # Recreate the release each time so the tag always points at the newest commit.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Android app $VERSION" \
            --notes "$NOTES" \
            --latest
