plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

// CI passes a rising versionCode (Android only installs an update when it is higher
// than the installed one) and a matching versionName. Local builds keep the defaults.
def mmVersionCode = (project.findProperty("mmVersionCode") ?: "2").toString().toInteger()
def mmVersionName = (project.findProperty("mmVersionName") ?: "2.0.0").toString()

// Release signing comes from the environment so no key is ever committed. Android
// refuses to update an installed app that was signed with a different key, so this
// key must stay the same for every release.
def mmKeystoreFile = System.getenv("MM_KEYSTORE_FILE")

def mmBaseUrl = (project.findProperty("mmBaseUrl") ?: "")
        .toString()
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace "com.mainnetwallet.mmagent"
    compileSdk 35

    defaultConfig {
        applicationId "com.mainnetwallet.mmagent"
        minSdk 26
        targetSdk 35
        versionCode mmVersionCode
        versionName mmVersionName
        buildConfigField "String", "DEFAULT_BASE_URL", "\"${mmBaseUrl}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    signingConfigs {
        if (mmKeystoreFile) {
            release {
                storeFile file(mmKeystoreFile)
                storePassword System.getenv("MM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MM_KEY_ALIAS")
                keyPassword System.getenv("MM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            if (mmKeystoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // CI builds never need the extra lintVital pass that assembleRelease runs by default; it only slows the build.
    lint {
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.6"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.fragment:fragment-ktx:1.8.5"
    implementation "androidx.browser:browser:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "com.google.zxing:core:3.5.3"

    debugImplementation "androidx.compose.ui:ui-tooling"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
}
