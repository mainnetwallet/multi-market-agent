services:
  agent:
    build: .
    container_name: mm-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Dhaka
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: sqlite:////app/data/mm_agent.db
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - mm_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8080/health', method='HEAD'); urllib.request.urlopen(req, timeout=4).read()",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s

volumes:
  mm_data:
